<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="logoWaveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C4FF"/>
      <stop offset="60%" stop-color="#2B8CFF"/>
      <stop offset="100%" stop-color="#0A1F44"/>
    </linearGradient>
    <linearGradient id="logoEyeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2B8CFF"/>
      <stop offset="50%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#2B8CFF"/>
    </linearGradient>
    <linearGradient id="logoMtnGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1E4D8C"/>
      <stop offset="100%" stop-color="#0A1F44"/>
    </linearGradient>
    <filter id="eyeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Outer Shield Contour -->
  <circle cx="60" cy="60" r="56" fill="#0A1F44" stroke="#1E4D8C" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="51" fill="none" stroke="#2B8CFF" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>

  <!-- Mountain Peaks (Himalayan / Western Ghats Watershed) -->
  <!-- Back Mountain -->
  <polygon points="60,34 82,68 38,68" fill="#163A6E" opacity="0.9"/>
  <polygon points="60,34 82,68 60,68" fill="#0D274D" opacity="0.9"/>

  <!-- Front Mountains -->
  <polygon points="44,46 66,74 22,74" fill="url(#logoMtnGrad)"/>
  <polygon points="76,43 98,74 54,74" fill="#13315C"/>
  <polygon points="60,38 78,74 42,74" fill="url(#logoMtnGrad)"/>
  
  <!-- Snowcaps / Ridge Highlights -->
  <polygon points="60,38 65,48 55,48" fill="#E8F2FF" opacity="0.9"/>
  <polygon points="44,46 48,54 40,54" fill="#E8F2FF" opacity="0.8"/>
  <polygon points="76,43 80,51 72,51" fill="#E8F2FF" opacity="0.8"/>

  <!-- Dynamic Blue Flood Waves Flowing Across Valley -->
  <path d="M12 76 C 30 68, 45 84, 65 74 C 85 64, 100 80, 108 75 L 108 98 C 95 106, 75 110, 60 110 C 45 110, 25 106, 12 98 Z" 
        fill="url(#logoWaveGrad)" opacity="0.95"/>
  
  <path d="M16 82 C 34 76, 50 88, 68 80 C 86 72, 98 84, 106 81" 
        stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85"/>

  <path d="M22 89 C 38 84, 54 94, 72 87 C 88 81, 96 89, 102 88" 
        stroke="#93C5FD" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- The All-Seeing Third Eye of Shiva (Trinetra) Arched Over the Peaks -->
  <path d="M26 40 C 44 22, 76 22, 94 40 C 76 54, 44 54, 26 40 Z" 
        fill="none" stroke="url(#logoEyeGrad)" stroke-width="3" stroke-linecap="round" filter="url(#eyeGlow)"/>

  <!-- Iris & Pulse Pupil -->
  <ellipse cx="60" cy="38" rx="8" ry="8" fill="#00D2FF"/>
  <circle cx="60" cy="38" r="4" fill="#FFFFFF"/>
  <circle cx="60" cy="38" r="2" fill="#0A1F44"/>

  <!-- Early Warning Ray Antenna Apex -->
  <circle cx="60" cy="18" r="2.5" fill="#00D2FF"/>
  <line x1="60" y1="21" x2="60" y2="27" stroke="#00D2FF" stroke-width="1.5" stroke-dasharray="1.5 1.5"/>
</svg>
